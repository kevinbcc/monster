<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <meta name="theme-color" content="#FFB7C5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="櫻花斬妖帖">
  <title>打敗怪物</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --sk:#FFB7C5;--sk2:#FF8FAB;--pt:#FFE4EE;--pt2:#FFF0F5;
      --txt:#5C3D4E;--txt2:#9B7088;--txt3:#C4A0B5;
      --card:#FFFAFC;--pu:#C4A0E0;--gr:#7EC8A0;--gold:#F5C842;
    }
    html,body{width:100%;height:100%;min-height:100dvh;font-family:'Nunito',sans-serif;background:var(--pt2);color:var(--txt);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;overflow:hidden;position:fixed;}
    .wrap{width:100%;max-width:100%;height:100%;max-height:100dvh;margin:0 auto;background:var(--pt2);position:relative;overflow:auto;-webkit-overflow-scrolling:touch;padding-top:max(0px,env(safe-area-inset-top));padding-bottom:max(0px,env(safe-area-inset-bottom));}
    .petals-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
    .pf{position:absolute;width:9px;height:9px;background:var(--sk);border-radius:50% 0 50% 0;animation:fall linear infinite}
    @keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:0.55}100%{transform:translateY(110vh) rotate(400deg);opacity:0}}

    .content{position:relative;z-index:1;padding:clamp(14px,3.5vw,28px);display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vw,20px)}

    /* ── Header ── */
    .header{width:100%;display:flex;justify-content:space-between;align-items:center}
    .title{font-size:clamp(18px,5vw,28px);font-weight:900;color:var(--sk2)}
    .title small{display:block;font-size:clamp(11px,2.8vw,13px);font-weight:700;color:var(--txt3);margin-top:1px}
    .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
    .streak{background:var(--pt);border-radius:14px;padding:clamp(4px,1.2vw,8px) clamp(10px,3vw,18px);text-align:center;border:1.5px solid rgba(255,183,197,0.4)}
    .streak-n{font-size:clamp(20px,6vw,32px);font-weight:900;color:var(--sk2);line-height:1}
    .streak-l{font-size:clamp(10px,2.3vw,12px);font-weight:700;color:var(--txt3)}
    .stats-btn{background:var(--pu);color:white;border:none;border-radius:10px;padding:4px 10px;font-family:'Nunito',sans-serif;font-size:clamp(10px,2.5vw,12px);font-weight:800;cursor:pointer;opacity:0.85}
    .stats-btn:active{opacity:1;transform:scale(0.96)}

    /* ── Mini Stats Bar ── */
    .stats-bar{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.5vw,10px)}
    .stat-cell{background:var(--card);border-radius:12px;border:1.5px solid rgba(255,183,197,0.25);padding:clamp(8px,2vw,12px);text-align:center}
    .stat-n{font-size:clamp(16px,4.5vw,22px);font-weight:900;color:var(--sk2);line-height:1}
    .stat-l{font-size:clamp(9px,2vw,11px);font-weight:700;color:var(--txt3);margin-top:2px}

    /* ── Monster Box ── */
    .monster-box{width:100%;background:var(--card);border-radius:clamp(16px,4vw,24px);border:1.5px solid rgba(255,183,197,0.3);padding:clamp(12px,3vw,20px);display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.8vw,10px)}
    .hp-row{width:100%;display:flex;justify-content:space-between;font-size:clamp(11px,2.8vw,14px);font-weight:800;color:var(--txt2)}
    .hp-track{width:100%;height:clamp(10px,2.5vw,14px);background:rgba(255,183,197,0.2);border-radius:20px;border:1.5px solid rgba(255,143,171,0.25);overflow:hidden}
    .hp-fill{height:100%;border-radius:20px;background:var(--sk2);transition:width 0.7s cubic-bezier(.34,1.56,.64,1);position:relative}
    .hp-fill::after{content:'';position:absolute;top:2px;left:6px;right:6px;height:35%;background:rgba(255,255,255,0.45);border-radius:10px}
    .monster-wrap{position:relative;cursor:pointer;user-select:none;width:clamp(120px,35vw,180px);height:clamp(120px,35vw,180px)}
    .monster-wrap:active svg{transform:scale(0.9)}
    svg{transition:transform 0.1s;display:block;width:100%;height:100%}
    .monster-wrap.boing svg{animation:boing 0.4s cubic-bezier(.36,.07,.19,.97)}
    @keyframes boing{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,-3px) rotate(-4deg)}50%{transform:translate(5px,-2px) rotate(3deg)}80%{transform:translate(-3px,2px) rotate(-2deg)}}
    .dmg-pop{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-size:clamp(14px,4vw,22px);font-weight:900;color:var(--sk2);pointer-events:none;opacity:0;white-space:nowrap;z-index:10}
    .dmg-pop.go{animation:popfloat 0.7s ease forwards}
    @keyframes popfloat{0%{opacity:1;transform:translateX(-50%) scale(0.7) translateY(0)}50%{opacity:1;transform:translateX(-50%) scale(1.2) translateY(-20px)}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-44px)}}
    .monster-lbl{font-size:clamp(11px,2.8vw,13px);font-weight:800;color:var(--txt3)}
    .tap-hint{font-size:clamp(11px,2.5vw,13px);color:var(--txt3);font-weight:700}

    /* ── Check-in Box ── */
    .checkin-box{width:100%;background:var(--card);border-radius:clamp(16px,4vw,24px);border:1.5px solid rgba(255,183,197,0.3);padding:clamp(14px,3.5vw,20px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vw,12px)}
    .checkin-lbl{font-size:clamp(11px,2.8vw,13px);font-weight:800;color:var(--txt2)}
    .encourage{width:100%;padding:clamp(8px,2vw,12px);background:var(--pt);border-radius:12px;font-size:clamp(12px,3vw,14px);font-weight:700;color:var(--txt2);line-height:1.6;text-align:center;border:1px solid rgba(255,183,197,0.25);min-height:44px;display:flex;align-items:center;justify-content:center}
    .checkin-btn{width:100%;padding:clamp(14px,3.5vw,20px);border-radius:16px;border:none;background:var(--sk2);color:white;font-family:'Nunito',sans-serif;font-size:clamp(15px,4vw,20px);font-weight:900;cursor:pointer;transition:all 0.2s}
    .checkin-btn:active{transform:scale(0.97)}
    .checkin-btn.done-state{background:var(--gr);pointer-events:none}

    /* ── Mood Picker ── */
    .mood-row{width:100%;display:none;flex-direction:column;align-items:center;gap:8px}
    .mood-row.visible{display:flex}
    .mood-q{font-size:clamp(12px,3vw,14px);font-weight:800;color:var(--txt2)}
    .mood-opts{display:flex;gap:clamp(6px,2vw,12px);justify-content:center}
    .mood-opt{font-size:clamp(22px,6vw,30px);cursor:pointer;border:2px solid transparent;border-radius:50%;padding:4px;transition:all 0.2s;line-height:1}
    .mood-opt:active,.mood-opt.selected{border-color:var(--sk2);background:var(--pt);transform:scale(1.15)}
    .mood-saved{font-size:clamp(11px,2.5vw,13px);font-weight:700;color:var(--gr);display:none}
    .mood-saved.show{display:block}

    /* ── Calendar ── */
    .calendar-box{width:100%;background:var(--card);border-radius:clamp(16px,4vw,24px);border:1.5px solid rgba(255,183,197,0.3);padding:clamp(12px,3vw,18px)}
    .cal-title{font-size:clamp(10px,2.2vw,12px);font-weight:800;color:var(--txt3);letter-spacing:2px;text-transform:uppercase;margin-bottom:clamp(6px,1.8vw,12px);text-align:center}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(3px,1vw,6px)}
    .cal-day{aspect-ratio:1;border-radius:clamp(5px,1.2vw,10px);display:flex;align-items:center;justify-content:center;font-size:clamp(9px,2.2vw,12px);font-weight:800;color:var(--txt3);background:rgba(255,183,197,0.1)}
    .cal-day.header-d{font-size:clamp(8px,1.8vw,10px);font-weight:700;background:transparent;color:var(--txt3)}
    .cal-day.done{background:var(--pt);font-size:0;position:relative}
    .cal-day.done::after{content:'🌸';font-size:clamp(9px,2.5vw,14px);position:absolute}
    .cal-day.done.mood-happy::after{content:'😊'}
    .cal-day.done.mood-calm::after{content:'😌'}
    .cal-day.done.mood-sad::after{content:'😔'}
    .cal-day.done.mood-angry::after{content:'😤'}
    .cal-day.done.mood-tired::after{content:'😴'}
    .cal-day.today{border:2px solid var(--sk2)}
    .cal-day.future{opacity:0.25}

    /* ── Badges Section ── */
    .badges-box{width:100%;background:var(--card);border-radius:clamp(16px,4vw,24px);border:1.5px solid rgba(255,183,197,0.3);padding:clamp(12px,3vw,18px)}
    .badges-title{font-size:clamp(10px,2.2vw,12px);font-weight:800;color:var(--txt3);letter-spacing:2px;text-transform:uppercase;margin-bottom:clamp(8px,2vw,14px);text-align:center}
    .badges-scroll{display:flex;gap:clamp(8px,2vw,14px);overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .badges-scroll::-webkit-scrollbar{display:none}
    .badge-item{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;width:clamp(60px,16vw,80px);cursor:default}
    .badge-icon{width:clamp(46px,12vw,60px);height:clamp(46px,12vw,60px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5.5vw,26px);border:2px solid;position:relative;transition:all 0.3s}
    .badge-icon.unlocked{background:linear-gradient(135deg,#FFF0F5,#FFE4EE);border-color:var(--sk2);box-shadow:0 2px 10px rgba(255,143,171,0.25)}
    .badge-icon.locked{background:rgba(196,160,181,0.08);border-color:rgba(196,160,181,0.2);filter:grayscale(1);opacity:0.35}
    .badge-name{font-size:clamp(8px,1.9vw,11px);font-weight:800;color:var(--txt3);text-align:center;line-height:1.3}
    .badge-name.unlocked{color:var(--sk2)}
    .badge-desc{font-size:clamp(7px,1.6vw,9px);font-weight:700;color:var(--txt3);text-align:center;line-height:1.3;opacity:0.75}
    .badge-desc.unlocked{opacity:1;color:var(--txt2)}

    /* ── Badge unlock pop ── */
    .new-badge-pop{position:fixed;top:clamp(60px,15vw,90px);left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FFB7C5,#C4A0E0);color:white;border-radius:20px;padding:10px 22px;font-size:clamp(12px,3vw,14px);font-weight:900;z-index:300;opacity:0;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(255,143,171,0.4)}
    .new-badge-pop.pop{animation:badgepop 2.8s ease forwards}
    @keyframes badgepop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(0.85)}15%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}80%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(0.9)}}

    /* ── Overlays ── */
    .overlay{position:fixed;inset:0;background:rgba(92,61,78,0.55);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.35s;min-height:100dvh;}
    .overlay.show{opacity:1;pointer-events:all}
    .lv-card{background:var(--card);border-radius:clamp(16px,4vw,24px);padding:clamp(22px,5vw,32px) clamp(18px,4.5vw,28px);text-align:center;border:2px solid var(--pu);width:min(290px,85%);position:relative}
    .lv-petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
    .fp2{position:absolute;width:10px;height:10px;border-radius:50% 0 50% 0;animation:fpup 1.4s ease forwards}
    @keyframes fpup{0%{opacity:0.9;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(-110px) rotate(200deg)}}
    .lv-icon{font-size:clamp(34px,9vw,50px);margin-bottom:4px}
    .lv-title{font-size:clamp(16px,4.5vw,22px);font-weight:900;color:var(--pu);margin-bottom:4px}
    .lv-sub{font-size:clamp(11px,2.8vw,13px);font-weight:700;color:var(--txt2);margin-bottom:clamp(12px,3vw,18px);line-height:1.5}
    .lv-btn{padding:clamp(8px,2vw,12px) clamp(22px,5.5vw,32px);border-radius:20px;border:none;background:var(--pu);color:white;font-family:'Nunito',sans-serif;font-size:clamp(12px,3vw,14px);font-weight:800;cursor:pointer}

    /* ── Stats Overlay ── */
    .stats-card{background:var(--card);border-radius:clamp(16px,4vw,24px);padding:clamp(20px,5vw,30px);width:min(300px,88%);position:relative}
    .stats-card-title{font-size:clamp(14px,4vw,18px);font-weight:900;color:var(--sk2);margin-bottom:clamp(12px,3vw,18px);text-align:center}
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vw,12px)}
    .stats-item{background:var(--pt);border-radius:12px;padding:clamp(10px,2.5vw,14px);text-align:center}
    .stats-item .n{font-size:clamp(20px,5.5vw,28px);font-weight:900;color:var(--sk2);line-height:1}
    .stats-item .l{font-size:clamp(10px,2.3vw,12px);font-weight:700;color:var(--txt3);margin-top:3px}
    .stats-close{margin-top:clamp(12px,3vw,18px);width:100%;padding:10px;border-radius:14px;border:none;background:var(--sk2);color:white;font-family:'Nunito',sans-serif;font-size:clamp(12px,3vw,14px);font-weight:800;cursor:pointer}
    .best-streak-row{background:linear-gradient(135deg,#FFF0F5,#FFE4EE);border-radius:12px;padding:clamp(10px,2.5vw,14px);text-align:center;margin-bottom:0;border:1.5px solid rgba(255,183,197,0.4)}
    .best-streak-row .n{font-size:clamp(22px,6vw,30px);font-weight:900;color:var(--sk2);line-height:1}
    .best-streak-row .l{font-size:clamp(10px,2.3vw,12px);font-weight:700;color:var(--txt3);margin-top:3px}

    /* ── Badge tooltip ── */
    .badge-item{position:relative}
    .badge-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--txt);color:white;border-radius:10px;padding:6px 10px;font-size:10px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.2s;z-index:50;line-height:1.4;text-align:center;max-width:140px;white-space:normal}
    .badge-item:hover .badge-tip{opacity:1}
  </style>
</head>
<body>
<div class="wrap" id="mainWrap">
  <div class="petals-bg" id="petalsArea"></div>
  <div class="content">

    <!-- Header -->
    <div class="header">
      <div class="title">打敗怪物<small id="dateStr">今日的挑戰</small></div>
      <div class="header-right">
        <div class="streak"><div class="streak-n" id="streakN">0</div><div class="streak-l">天連勝</div></div>
        <button class="stats-btn" onclick="openStats()">📊 我的戰績</button>
      </div>
    </div>

    <!-- Mini Stats Bar -->
    <div class="stats-bar">
      <div class="stat-cell"><div class="stat-n" id="statDays">0</div><div class="stat-l">累積簽到</div></div>
      <div class="stat-cell"><div class="stat-n" id="statMonsters">0</div><div class="stat-l">怪物消滅</div></div>
      <div class="stat-cell"><div class="stat-n" id="statTaps">0</div><div class="stat-l">攻擊次數</div></div>
    </div>

    <!-- Monster -->
    <div class="monster-box">
      <div class="hp-row"><span id="monsterLbl">Lv.1 焦慮小芽</span><span id="hpTxt">150 / 150</span></div>
      <div class="hp-track"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
      <div class="monster-wrap" id="monsterWrap" onclick="tapMonster()">
        <div class="dmg-pop" id="dmgPop"></div>
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="80" cy="118" rx="40" ry="12" fill="rgba(255,183,197,0.18)"/>
          <circle cx="80" cy="92" r="36" fill="#FFD6E4"/>
          <circle cx="80" cy="88" r="30" fill="#FFEBF2"/>
          <ellipse cx="80" cy="96" rx="25" ry="20" fill="#FFD6E4"/>
          <ellipse cx="66" cy="66" rx="11" ry="14" fill="#FFD6E4"/>
          <ellipse cx="94" cy="66" rx="11" ry="14" fill="#FFD6E4"/>
          <ellipse cx="66" cy="63" rx="7" ry="10" fill="#FFEBF2"/>
          <ellipse cx="94" cy="63" rx="7" ry="10" fill="#FFEBF2"/>
          <ellipse cx="64" cy="85" rx="8" ry="6" fill="white"/>
          <ellipse cx="96" cy="85" rx="8" ry="6" fill="white"/>
          <circle cx="65" cy="86" r="4.5" fill="#5C3D4E"/>
          <circle cx="97" cy="86" r="4.5" fill="#5C3D4E"/>
          <circle cx="66.5" cy="84.5" r="1.6" fill="white"/>
          <circle cx="98.5" cy="84.5" r="1.6" fill="white"/>
          <path id="mth" d="M73 98 Q80 104 87 98" stroke="#C4956A" stroke-width="2" fill="none" stroke-linecap="round"/>
          <ellipse cx="57" cy="91" rx="6" ry="4" fill="rgba(255,143,171,0.3)"/>
          <ellipse cx="103" cy="91" rx="6" ry="4" fill="rgba(255,143,171,0.3)"/>
          <ellipse cx="47" cy="102" rx="9" ry="7" fill="#FFD6E4"/>
          <ellipse cx="113" cy="102" rx="9" ry="7" fill="#FFD6E4"/>
          <g id="sweat" opacity="0">
            <ellipse cx="108" cy="64" rx="3.5" ry="5" fill="#B0D8FF"/>
            <ellipse cx="108" cy="59" rx="1.8" ry="2.5" fill="#B0D8FF"/>
          </g>
        </svg>
      </div>
      <div class="monster-lbl">今天的焦慮化身</div>
      <div class="tap-hint">輕點小怪可以攻擊！</div>
    </div>

    <!-- Check-in -->
    <div class="checkin-box">
      <div class="checkin-lbl">今日簽到</div>
      <div class="encourage" id="encourageTxt">點下方按鈕，看看今天的鼓勵！</div>

      <!-- Mood Picker -->
      <div class="mood-row" id="moodRow">
        <div class="mood-q">今天心情如何？🌸</div>
        <div class="mood-opts">
          <span class="mood-opt" onclick="saveMood('happy')" title="開心">😊</span>
          <span class="mood-opt" onclick="saveMood('calm')" title="平靜">😌</span>
          <span class="mood-opt" onclick="saveMood('sad')" title="低落">😔</span>
          <span class="mood-opt" onclick="saveMood('angry')" title="煩躁">😤</span>
          <span class="mood-opt" onclick="saveMood('tired')" title="疲憊">😴</span>
        </div>
        <div class="mood-saved" id="moodSaved">心情記下來了 ✓</div>
      </div>

      <button class="checkin-btn" id="checkinBtn" onclick="doCheckIn()">今天也來打怪！</button>
    </div>

    <!-- Calendar -->
    <div class="calendar-box">
      <div class="cal-title">本月出勤紀錄</div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <!-- Badges -->
    <div class="badges-box">
      <div class="badges-title">✨ 小小紀念章</div>
      <div class="badges-scroll" id="badgesScroll"></div>
    </div>

  </div>

  <!-- Level Up Overlay -->
  <div class="overlay" id="overlay">
    <div class="lv-card">
      <div class="lv-petals" id="lvPetals"></div>
      <div class="lv-icon">🌸</div>
      <div class="lv-title" id="lvTitle">升級了！</div>
      <div class="lv-sub" id="lvSub">你越來越厲害了！</div>
      <button class="lv-btn" onclick="closeLvup()">繼續加油！</button>
    </div>
  </div>

  <!-- Stats Overlay -->
  <div class="overlay" id="statsOverlay">
    <div class="stats-card">
      <div class="stats-card-title">🌸 我的旅程</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="best-streak-row">
          <div class="n" id="stBest">0</div>
          <div class="l">🌙 最長連續陪伴</div>
        </div>
        <div class="stats-grid">
          <div class="stats-item"><div class="n" id="stDays">0</div><div class="l">🌷 出現的天數</div></div>
          <div class="stats-item"><div class="n" id="stMonsters">0</div><div class="l">💨 趕走的焦慮</div></div>
          <div class="stats-item"><div class="n" id="stTaps">0</div><div class="l">🌸 輕點的次數</div></div>
          <div class="stats-item"><div class="n" id="stDmg">0</div><div class="l">✨ 累積的勇氣</div></div>
        </div>
      </div>
      <button class="stats-close" onclick="closeStats()">關閉</button>
    </div>
  </div>

  <!-- Badge Unlock Pop -->
  <div class="new-badge-pop" id="newBadgePop"></div>
</div>

<script>
/* ── Data ── */
var encouragements=['今天能來，就已經很厲害了 🌸','焦慮只是暫時的，你比它強大 ✨','每一次打卡都是對自己的溫柔 🌷','你不需要完美，只需要今天出現 🌸','小步前進也是前進，為你驕傲 🍀','深呼吸，今天的你已經很棒了 🌸','焦慮打不倒你，因為你每天都在 ✨','允許自己慢慢來，花開有時節 🌷','你比昨天的自己又勇敢一點了 🦋','記得喝水，好好照顧自己 🌸','今天的小努力，就是明天的力量 🌸','不管感覺怎樣，你今天都來了，這就夠了 🌸','你的存在本身，就是一件美好的事 ✨','累了就休息一下，地球還是會轉的 🌍','把心裡的重擔輕輕放下吧 🍃','哪怕是微光，也是你發出的光芒 🌟','不要對自己太嚴格了，這世界已經夠難了 🫂','慢慢呼吸，感覺這份平靜 🎐','走得慢沒關係，至少你還在走 👣','你的感受都是真實而重要的 💖','今天辛苦了，抱抱自己吧 🤗','就算犯錯了，也是成長的一部分 🌱','把專注力拉回當下，一切安好 🍵','你的光芒不需要別人來定義 💫','有時候，什麼都不做也是一種選擇 🛋️','明天又是新的一天，會有新的希望 🌅'];

/* ── Badges — warm & gentle, not gamey ── */
var BADGES=[
  {
    id:'first',icon:'🌱',name:'第一步',
    desc:'今天出現了，這就是最重要的一步',
    unlock:'謝謝你今天來了 🌱\n踏出第一步，真的很勇敢。',
    check:function(s){return s.totalCheckins>=1;}
  },
  {
    id:'streak3',icon:'🕯️',name:'小小的光',
    desc:'連續三天都出現了，像一盞溫柔的燈',
    unlock:'連續三天都來了 🕯️\n就算只是一點點光，也足夠照亮自己。',
    check:function(s){return s.bestStreak>=3;}
  },
  {
    id:'streak7',icon:'🌷',name:'一週的你',
    desc:'整整一週，每天都陪著自己',
    unlock:'七天都在 🌷\n一週裡，每一天都是你給自己的禮物。',
    check:function(s){return s.bestStreak>=7;}
  },
  {
    id:'streak14',icon:'🌙',name:'靜靜的月光',
    desc:'兩週了，月亮看見你每晚的溫柔',
    unlock:'堅持了兩週 🌙\n月光都記得你每一個夜晚的樣子。',
    check:function(s){return s.bestStreak>=14;}
  },
  {
    id:'streak30',icon:'🌸',name:'整月的花',
    desc:'一整個月，每天都溫柔地出現',
    unlock:'一個月都在 🌸\n這份溫柔和堅持，讓你自己開出了花。',
    check:function(s){return s.bestStreak>=30;}
  },
  {
    id:'tap50',icon:'✋',name:'輕輕打過去',
    desc:'攻擊了50次，每一下都是勇氣',
    unlock:'50次攻擊 ✋\n每一下輕點，都是說「我不怕你」的聲音。',
    check:function(s){return s.totalTaps>=50;}
  },
  {
    id:'tap200',icon:'💫',name:'閃閃的手',
    desc:'200次攻擊，你的手都在發光了',
    unlock:'200次攻擊 💫\n閃閃的，那是你每次勇敢的痕跡。',
    check:function(s){return s.totalTaps>=200;}
  },
  {
    id:'monster1',icon:'🍃',name:'第一次趕走',
    desc:'第一隻焦慮被你輕輕吹走了',
    unlock:'趕走第一隻怪物 🍃\n焦慮只是一陣風，你把它吹走了。',
    check:function(s){return s.monstersDefeated>=1;}
  },
  {
    id:'monster5',icon:'🌈',name:'彩虹出來了',
    desc:'五隻焦慮都趕走了，雨後見彩虹',
    unlock:'趕走了5隻怪物 🌈\n那麼多風雨都過了，彩虹就是你。',
    check:function(s){return s.monstersDefeated>=5;}
  },
  {
    id:'monster20',icon:'🦋',name:'蝴蝶飛起來',
    desc:'20隻焦慮，全部變成了蝴蝶飛走',
    unlock:'趕走了20隻焦慮 🦋\n每隻怪物都變成蝴蝶了，因為你在。',
    check:function(s){return s.monstersDefeated>=20;}
  },
  {
    id:'days10',icon:'🫧',name:'十天的氣泡',
    desc:'累積簽到10天，輕盈地浮著',
    unlock:'累積10天簽到 🫧\n輕輕地，一天一天地，你一直都在。',
    check:function(s){return s.totalCheckins>=10;}
  },
  {
    id:'days30',icon:'🌺',name:'三十朵小花',
    desc:'30天了，每天都開出一朵花',
    unlock:'累積30天簽到 🌺\n三十朵花，全都是你開的，好美。',
    check:function(s){return s.totalCheckins>=30;}
  },
  {
    id:'mood',icon:'💌',name:'心情信',
    desc:'第一次寫下今天的感受',
    unlock:'第一次記錄心情 💌\n把感受說出來，就是對自己最溫柔的事。',
    check:function(s){return s.moodCount>=1;}
  },
  {
    id:'dmg1000',icon:'🌟',name:'千顆星星',
    desc:'累積傷害破千，每一點都是光',
    unlock:'累積傷害破千 🌟\n千顆星星，每一顆都是你的勇敢留下的。',
    check:function(s){return s.totalDmg>=1000;}
  },
  {
    id:'dmg10000',icon:'🌙✨',name:'月亮和星星',
    desc:'累積傷害破萬，你照亮了整片天',
    unlock:'累積傷害破萬 🌙✨\n月亮和星星都為你在閃亮。',
    check:function(s){return s.totalDmg>=10000;}
  }
];

/* ── Monsters ── */
var monsters=[];
for(var i=1;i<=100;i++){
  var mName='焦慮小芽';
  if(i>=80)mName='焦慮魔王';
  else if(i>=50)mName='焦慮大叔';
  else if(i>=20)mName='焦慮胖嘟';
  else if(i>=5)mName='焦慮小童';
  monsters.push({name:'Lv.'+i+' '+mName,maxHp:100+Math.floor(Math.pow(i,1.5)*50),tapDmg:4+Math.floor(i*1.5),checkinDmg:40+i*15});
}

/* ── State ── */
var st={mIdx:0,mHp:150,streak:0,bestStreak:0,totalTaps:0,totalDmg:0,monstersDefeated:0,totalCheckins:0,moodCount:0};
var checkedDays=[];
var moodData={};
var unlockedBadges=[];

function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function getM(){return monsters[Math.min(st.mIdx,monsters.length-1)];}

/* ── Persist ── */
function loadData(){
  try{var r=localStorage.getItem('sakura_st');if(r)st=Object.assign({mIdx:0,mHp:150,streak:0,bestStreak:0,totalTaps:0,totalDmg:0,monstersDefeated:0,totalCheckins:0,moodCount:0},JSON.parse(r));}catch(e){}
  try{var r=localStorage.getItem('sakura_days');if(r)checkedDays=JSON.parse(r);}catch(e){}
  try{var r=localStorage.getItem('sakura_mood');if(r)moodData=JSON.parse(r);}catch(e){}
  try{var r=localStorage.getItem('sakura_badges');if(r)unlockedBadges=JSON.parse(r);}catch(e){}
  updateUI();checkCheckinState();buildCalendar();buildBadges();
  if(checkedDays.indexOf(todayKey())!==-1){showMoodPickerState();}
}

function persist(){
  try{localStorage.setItem('sakura_st',JSON.stringify(st));}catch(e){}
  try{localStorage.setItem('sakura_days',JSON.stringify(checkedDays));}catch(e){}
  try{localStorage.setItem('sakura_mood',JSON.stringify(moodData));}catch(e){}
  try{localStorage.setItem('sakura_badges',JSON.stringify(unlockedBadges));}catch(e){}
}

/* ── UI ── */
function updateUI(){
  var m=getM();
  var pct=Math.max(0,Math.round(st.mHp/m.maxHp*100));
  document.getElementById('hpFill').style.width=pct+'%';
  document.getElementById('hpTxt').textContent=Math.max(0,st.mHp)+' / '+m.maxHp;
  document.getElementById('monsterLbl').textContent=m.name;
  document.getElementById('streakN').textContent=st.streak;
  document.getElementById('statDays').textContent=st.totalCheckins||checkedDays.length;
  document.getElementById('statMonsters').textContent=st.monstersDefeated;
  document.getElementById('statTaps').textContent=st.totalTaps;
}

function checkCheckinState(){
  if(checkedDays.indexOf(todayKey())!==-1){
    var btn=document.getElementById('checkinBtn');
    btn.classList.add('done-state');btn.textContent='✓  今天已簽到！';
  }
}

function showMoodPickerState(){
  var row=document.getElementById('moodRow');
  row.classList.add('visible');
  if(moodData[todayKey()]){
    var saved=document.getElementById('moodSaved');
    saved.classList.add('show');
    var opts=document.querySelectorAll('.mood-opt');
    var todayMood=moodData[todayKey()];
    var moodArr=['happy','calm','sad','angry','tired'];
    for(var i=0;i<opts.length;i++){
      if(moodArr[i]===todayMood)opts[i].classList.add('selected');
    }
  }
}

/* ── Damage & Combat ── */
function animDmg(n){
  var p=document.getElementById('dmgPop');
  p.textContent='-'+n+' !';p.classList.remove('go');void p.offsetWidth;p.classList.add('go');
}

function shakeMonster(){
  var w=document.getElementById('monsterWrap');
  w.classList.remove('boing');void w.offsetWidth;w.classList.add('boing');
  setTimeout(function(){w.classList.remove('boing');},450);
  var mth=document.getElementById('mth');
  mth.setAttribute('d','M73 100 Q80 96 87 100');
  setTimeout(function(){mth.setAttribute('d','M73 98 Q80 104 87 98');},600);
  var sw=document.getElementById('sweat');
  sw.setAttribute('opacity','1');
  setTimeout(function(){sw.setAttribute('opacity','0');},900);
}

var isDefeating=false;
function dealDamage(dmg){
  if(isDefeating)return;
  st.mHp=Math.max(0,st.mHp-dmg);
  st.totalDmg+=dmg;
  animDmg(dmg);shakeMonster();updateUI();persist();
  checkBadges();
  if(st.mHp<=0){isDefeating=true;setTimeout(defeatMonster,700);}
}

function tapMonster(){
  if(!isDefeating){
    st.totalTaps++;
    dealDamage(getM().tapDmg);
    spawnPetals(3);
    persist();
    checkBadges();
  }
}

function defeatMonster(){
  isDefeating=false;
  st.monstersDefeated++;
  persist();
  if(st.mIdx<monsters.length-1){
    st.mIdx++;st.mHp=getM().maxHp;persist();updateUI();showLvUp(false);
  }else{showLvUp(true);}
  checkBadges();
}

/* ── Check-in ── */
function doCheckIn(){
  var today=todayKey();
  if(checkedDays.indexOf(today)!==-1)return;
  checkedDays.push(today);
  st.totalCheckins++;
  var yest=new Date();yest.setDate(yest.getDate()-1);
  var yk=yest.getFullYear()+'-'+(yest.getMonth()+1)+'-'+yest.getDate();
  st.streak=checkedDays.indexOf(yk)!==-1?st.streak+1:1;
  if(st.streak>st.bestStreak)st.bestStreak=st.streak;
  persist();
  var btn=document.getElementById('checkinBtn');
  btn.classList.add('done-state');btn.textContent='✓  今天已簽到！';
  var msg=encouragements[Math.floor(Math.random()*encouragements.length)];
  document.getElementById('encourageTxt').textContent=msg;
  spawnPetals(14);dealDamage(getM().checkinDmg);buildCalendar();
  showMoodPickerState();
  checkBadges();
}

/* ── Mood ── */
function saveMood(mood){
  var today=todayKey();
  var wasFirst=Object.keys(moodData).length===0;
  moodData[today]=mood;
  if(wasFirst||st.moodCount===0){st.moodCount=1;}
  else{st.moodCount++;}
  persist();
  var opts=document.querySelectorAll('.mood-opt');
  for(var i=0;i<opts.length;i++)opts[i].classList.remove('selected');
  var moodArr=['happy','calm','sad','angry','tired'];
  opts[moodArr.indexOf(mood)].classList.add('selected');
  document.getElementById('moodSaved').classList.add('show');
  buildCalendar();
  checkBadges();
  spawnPetals(5);
}

/* ── Badges ── */
function checkBadges(){
  var newOnes=[];
  for(var i=0;i<BADGES.length;i++){
    var b=BADGES[i];
    if(unlockedBadges.indexOf(b.id)===-1 && b.check(st)){
      unlockedBadges.push(b.id);
      newOnes.push(b);
    }
  }
  if(newOnes.length){persist();buildBadges();}
  for(var j=0;j<newOnes.length;j++){
    (function(badge,delay){
      setTimeout(function(){popBadge(badge);},delay);
    })(newOnes[j],j*3000);
  }
}

function popBadge(badge){
  var el=document.getElementById('newBadgePop');
  el.textContent=badge.icon+' '+badge.name+' — '+badge.unlock.split('\n')[0];
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
}

function buildBadges(){
  var wrap=document.getElementById('badgesScroll');wrap.innerHTML='';
  for(var i=0;i<BADGES.length;i++){
    var b=BADGES[i];
    var unlocked=unlockedBadges.indexOf(b.id)!==-1;
    var item=document.createElement('div');item.className='badge-item';
    var tipText=unlocked?b.unlock:b.desc;
    item.innerHTML=
      '<div class="badge-icon '+(unlocked?'unlocked':'locked')+'">'+b.icon+'</div>'+
      '<div class="badge-name '+(unlocked?'unlocked':'')+'">'+b.name+'</div>'+
      '<div class="badge-desc '+(unlocked?'unlocked':'')+'">'+b.desc+'</div>'+
      '<div class="badge-tip">'+tipText.replace(/\n/g,'<br>')+'</div>';
    wrap.appendChild(item);
  }
}

/* ── Level Up ── */
function showLvUp(last){
  document.getElementById('lvTitle').textContent=last?'你打倒焦慮魔王了！':getM().name+' 出現了！';
  document.getElementById('lvSub').textContent=last?'所有焦慮都被你打跑了，你超棒的！🌸':'擊敗上一關！新的挑戰在等你～';
  document.getElementById('overlay').classList.add('show');
  var lp=document.getElementById('lvPetals');lp.innerHTML='';
  for(var i=0;i<14;i++){
    var p=document.createElement('div');p.className='fp2';
    p.style.left=(5+Math.random()*90)+'%';
    p.style.bottom=(Math.random()*30)+'px';
    p.style.animationDelay=(Math.random()*0.7)+'s';
    p.style.background=Math.random()>0.5?'#FFB7C5':'#C4A0E0';
    lp.appendChild(p);
  }
}
function closeLvup(){document.getElementById('overlay').classList.remove('show');}

/* ── Stats Overlay ── */
function openStats(){
  document.getElementById('stBest').textContent=st.bestStreak;
  document.getElementById('stDays').textContent=st.totalCheckins;
  document.getElementById('stMonsters').textContent=st.monstersDefeated;
  document.getElementById('stTaps').textContent=st.totalTaps;
  var dmg=st.totalDmg;
  document.getElementById('stDmg').textContent=dmg>=10000?Math.floor(dmg/1000)+'k':dmg;
  document.getElementById('statsOverlay').classList.add('show');
}
function closeStats(){document.getElementById('statsOverlay').classList.remove('show');}

/* ── Petals ── */
function spawnPetals(n){
  var bg=document.getElementById('petalsArea');
  for(var i=0;i<n;i++){
    var p=document.createElement('div');p.className='pf';
    p.style.left=(Math.random()*100)+'%';
    p.style.animationDuration=(3+Math.random()*3)+'s';
    p.style.animationDelay=(Math.random()*0.8)+'s';
    p.style.opacity=(0.25+Math.random()*0.4);
    bg.appendChild(p);
    setTimeout((function(el){return function(){if(el.parentNode)el.parentNode.removeChild(el);};})(p),6000);
  }
}

/* ── Calendar ── */
function buildCalendar(){
  var now=new Date(),year=now.getFullYear(),month=now.getMonth(),todayDate=now.getDate();
  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var grid=document.getElementById('calGrid');grid.innerHTML='';
  ['日','一','二','三','四','五','六'].forEach(function(h){
    var hd=document.createElement('div');hd.className='cal-day header-d';hd.textContent=h;grid.appendChild(hd);
  });
  for(var b=0;b<firstDay;b++){var bl=document.createElement('div');bl.className='cal-day';grid.appendChild(bl);}
  for(var d=1;d<=daysInMonth;d++){
    var key=year+'-'+(month+1)+'-'+d;
    var el=document.createElement('div');
    var cls='cal-day';
    if(checkedDays.indexOf(key)!==-1){
      cls+=' done';
      if(moodData[key])cls+=' mood-'+moodData[key];
    }else if(d===todayDate)cls+=' today';
    else if(d>todayDate)cls+=' future';
    el.className=cls;
    if(checkedDays.indexOf(key)===-1)el.textContent=d;
    grid.appendChild(el);
  }
}

/* ── Init ── */
function initDate(){
  var d=new Date(),days=['日','一','二','三','四','五','六'];
  document.getElementById('dateStr').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日（週'+days[d.getDay()]+'）';
}
function initBgPetals(){
  var bg=document.getElementById('petalsArea');
  for(var i=0;i<8;i++){
    var p=document.createElement('div');p.className='pf';
    p.style.left=(Math.random()*100)+'%';
    p.style.animationDuration=(5+Math.random()*4)+'s';
    p.style.animationDelay=(-Math.random()*8)+'s';
    p.style.opacity=(0.15+Math.random()*0.25);
    bg.appendChild(p);
  }
}

initDate();initBgPetals();loadData();
</script>
</body>
</html>
